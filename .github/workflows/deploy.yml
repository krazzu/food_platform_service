name: Build & Deploy

on:
  push:
    branches: [main]
  # Можно запустить вручную из UI
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository = "username/repo-name" → образы будут
  # ghcr.io/username/repo-name/backend:latest
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ── 1. Сборка и пуш образов ──────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # нужно для пуша в ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # автоматически доступен, секрет не нужен

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BASE }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_BASE }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Деплой на сервер по SSH ───────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GITHUB_REPOSITORY,GITHUB_ACTOR
          script: |
            set -e
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export GITHUB_ACTOR="${{ github.actor }}"
            cd /root/food_platform

            # Залогиниться в ghcr.io на сервере
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u "$GITHUB_ACTOR" --password-stdin

            # Подтянуть свежие образы и перезапустить
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" docker compose -f docker-compose.prod.yml pull
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Очистить старые образы
            docker image prune -f
